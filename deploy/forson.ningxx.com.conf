# Install as a separate virtual host in the active Nginx configuration directory.
# Enable HTTPS with certbot after DNS for this hostname resolves to the server.
server {
    listen 80;
    server_name forson.ningxx.com;
    client_max_body_size 100m;
    auth_basic "Forson family classroom";
    auth_basic_user_file /opt/forson/access.htpasswd;

    location /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/letsencrypt;
    }
    location / {
        proxy_pass http://127.0.0.1:15178;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
    }
}
