# Cloudflare may use HTTP to the origin even when the visitor uses HTTPS.
map $http_x_forwarded_proto $forson_visitor_scheme {
    default $scheme;
    https https;
}

# Dedicated virtual host; the existing Cloudflare Origin CA wildcard covers this host.
server {
    listen 80;
    listen 443 ssl http2;
    server_name forson.ningxx.com;
    ssl_certificate /etc/nginx/ssl/ningxx.com.pem;
    ssl_certificate_key /etc/nginx/ssl/ningxx.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    if ($forson_visitor_scheme = http) {
        return 301 https://$host$request_uri;
    }

    client_max_body_size 100m;
    auth_basic "Forson family classroom";
    auth_basic_user_file /opt/forson/access.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:15178;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forson_visitor_scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
    }
}
