services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: zhijian
      POSTGRES_DB: zhijian
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Configure DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - zhijian-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhijian -d zhijian"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  zhijian-db:
